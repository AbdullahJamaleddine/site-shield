<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Featured — Admin — Drips & Drops</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebarSlot"></aside>
  <main class="admin-main">
    <div class="admin-header"><h1>Featured</h1></div>

    <p style="color:var(--fg-muted); font-size:13px; margin-bottom:18px;">
      Pick the products and combos that show up in the <strong>Featured</strong> section on the homepage. Select as many as you like — the homepage shows all of them.
    </p>

    <div class="admin-toolbar">
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-muted);"><span id="ftCount">0</span> selected</div>
      <button class="btn btn--solid" id="saveFtBtn">Save changes</button>
    </div>
    <div class="check-list" id="ftList" style="max-height:none;">Loading…</div>
  </main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="/js/firebase.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/featured.js"></script>
</body>
</html>

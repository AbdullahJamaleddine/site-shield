<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Login — Drips & Drops</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body>

<div class="login-shell">
  <div class="login-box">
    <h1>DRIPS &amp; DROPS</h1>
    <p>Admin sign in</p>
    <form id="loginForm">
      <div class="field"><label>Email</label><input type="email" id="email" required /></div>
      <div class="field"><label>Password</label><input type="password" id="password" required /></div>
      <button type="submit" class="btn btn--solid btn--block" id="loginBtn">Sign in</button>
    </form>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="/js/firebase.js"></script>
<script src="/js/ui.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try {
    const { auth } = await initFirebase();
    await auth.signInWithEmailAndPassword(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value
    );
    window.location.href = '/admin';
  } catch (err) {
    console.error(err);
    showToast('Invalid email or password', 'error');
    btn.disabled = false; btn.textContent = 'Sign in';
  }
});
</script>
</body>
</html>

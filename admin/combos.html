<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Combos — Admin — Drips & Drops</title>
<link rel="stylesheet" href="/css/style.css" />
<link rel="stylesheet" href="/css/admin.css" />
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar" id="adminSidebarSlot"></aside>
  <main class="admin-main">
    <div class="admin-header"><h1>Combos</h1></div>

    <div class="admin-toolbar">
      <div style="font-family:var(--font-mono); font-size:11px; color:var(--fg-muted);"><span id="cbCount">0</span> combos</div>
      <button class="btn btn--solid" id="addCbBtn">+ Add combo</button>
    </div>
    <table class="admin-table">
      <thead><tr><th>Name</th><th>Products</th><th>Price</th><th>Active</th><th>Created</th><th></th></tr></thead>
      <tbody id="cbTableBody"><tr><td colspan="6">Loading…</td></tr></tbody>
    </table>

    <div class="form-panel" id="cbFormPanel">
      <div class="form-panel__head">
        <h3 id="cbFormTitle">Add combo</h3>
        <button id="closeCbBtn">&times;</button>
      </div>
      <form id="cbForm">
        <div class="field"><label>Combo name</label><input type="text" id="gName" required /></div>
        <div class="field"><label>Combo price (₦)</label><input type="number" id="gPrice" min="0" required /></div>
        <div class="field"><label>Description</label><textarea id="gDesc" rows="3"></textarea></div>
        <div class="field">
          <label>Combo image</label>
          <div class="upload-zone" id="gUploadZone">Click to upload combo image</div>
          <input type="file" id="gFileInput" accept="image/*" hidden />
          <div class="image-previews" id="gImagePrev"></div>
        </div>
        <div class="field">
          <label>Products in this combo</label>
          <div class="check-list" id="gProdList"></div>
        </div>
        <label style="display:flex; gap:8px; align-items:center; font-family:var(--font-mono); font-size:12px; color:var(--fg-muted); margin-bottom:16px;">
          <input type="checkbox" id="gActive" checked style="width:auto;" /> Active
        </label>
        <button type="submit" class="btn btn--solid btn--block">Save combo</button>
      </form>
    </div>
  </main>
</div>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="/js/firebase.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script src="/admin/js/admin-auth.js"></script>
<script src="/admin/js/admin-shell.js"></script>
<script src="/admin/js/combos.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shop — Drips &amp; Drops</title>
<meta name="description" content="Shop the full Drips & Drops collection — tees, joggers, shorts and combos." />
<link rel="stylesheet" href="/css/style.css" />
<link rel="icon" href="/images/logo_icon_white.png" />
</head>
<body>

<section class="section">
  <div class="wrap">
    <div class="section__head">
      <div>
        <span class="eyebrow">Everything in stock</span>
        <h2>Shop</h2>
      </div>
    </div>

    <div class="shop-bar">
      <span class="shop-bar__count" id="shopCount">—</span>
      <select class="sort-select" id="shopSort" aria-label="Sort products">
        <option value="newest">Newest first</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="name">Name A–Z</option>
      </select>
      <button class="filter-btn" id="filterToggle" aria-label="Open filters">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="7" y1="12" x2="17" y2="12"></line><line x1="10" y1="18" x2="14" y2="18"></line></svg>
        Filters
        <span class="filter-btn__dot" id="filterCount" style="display:none;">0</span>
      </button>
    </div>

    <div class="grid" id="shopGrid">
      <div class="empty-state">Loading products…</div>
    </div>
  </div>
</section>

<div class="filter-backdrop" id="filterBackdrop"></div>
<aside class="filter-panel" id="filterPanel" aria-label="Filters">
  <div class="filter-panel__head">
    <h3>Filters</h3>
    <button class="filter-panel__close" id="filterClose" aria-label="Close filters">&times;</button>
  </div>
  <div class="filter-panel__body" id="filterBody"></div>
  <div class="filter-panel__foot">
    <button class="btn" id="filterReset">Clear all</button>
    <button class="btn btn--solid" id="filterApply">Show results</button>
  </div>
</aside>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore-compat.js"></script>
<script src="/js/firebase.js"></script>
<script src="/js/cart.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/home.js"></script>
<script src="/js/shop.js"></script>
</body>
</html>
